name: Upload Python Package

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: "3.14"
    - name: Build package
      run: uv build
    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: uv publish
