name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: "3.14"
    - name: Install project
      run: uv sync
    - name: Run linters
      run: uv run pre-commit run --all-files
